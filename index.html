<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Kids Play ✨ — Alina & Myra's Magical World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    /* Rain */
    .rain-wrap { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
    .rdrop { position:absolute; border-radius:0 0 3px 3px; animation:rfall linear infinite; top:-30px; }
    @keyframes rfall { 0%{transform:translateY(0) rotate(10deg);opacity:0} 8%{opacity:1} 92%{opacity:.8} 100%{transform:translateY(110vh) rotate(10deg);opacity:0} }

    /* Page */
    .luna-page { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px 12px 28px; position:relative; z-index:1; gap:0; }

    /* Duo section */
    .duo-row { display:flex; align-items:flex-end; justify-content:center; gap:10px; width:100%; max-width:520px; }

    /* Character column */
    .char-col { display:flex; flex-direction:column; align-items:center; gap:0; flex:1; max-width:220px; }

    /* Speech bubble */
    .bubble { background:rgba(255,255,255,0.93); border-radius:18px; padding:10px 14px; font-family:"Nunito",sans-serif; font-size:0.82rem; font-weight:800; max-width:190px; text-align:center; box-shadow:0 4px 16px rgba(214,51,132,0.18); backdrop-filter:blur(8px); position:relative; margin-bottom:6px; animation:bpop 0.6s cubic-bezier(0.34,1.6,0.64,1) both; }
    .bubble-a { border:2.5px solid rgba(236,72,153,0.3); color:#9d174d; animation-delay:0.4s; }
    .bubble-a::after { content:""; position:absolute; bottom:-16px; left:30px; border:9px solid transparent; border-top-color:rgba(236,72,153,0.3); }
    .bubble-a::before { content:""; position:absolute; bottom:-12px; left:32px; border:7px solid transparent; border-top-color:rgba(255,255,255,0.93); z-index:1; }
    .bubble-m { border:2.5px solid rgba(124,58,237,0.3); color:#4c1d95; animation-delay:0.9s; opacity:0; }
    .bubble-m.show { opacity:1; }
    .bubble-m::after { content:""; position:absolute; bottom:-16px; right:30px; border:9px solid transparent; border-top-color:rgba(124,58,237,0.3); }
    .bubble-m::before { content:""; position:absolute; bottom:-12px; right:32px; border:7px solid transparent; border-top-color:rgba(255,255,255,0.93); z-index:1; }
    @keyframes bpop { from{transform:scale(0.4) translateY(8px);opacity:0} to{transform:scale(1) translateY(0);opacity:1} }

    /* Character float */
    .char-float { animation:cfloat 3.2s ease-in-out infinite; filter:drop-shadow(0 10px 20px rgba(214,51,132,0.25)); }
    .char-float-2 { animation:cfloat2 3.6s ease-in-out infinite; filter:drop-shadow(0 10px 20px rgba(124,58,237,0.25)); }
    @keyframes cfloat  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-13px)} }
    @keyframes cfloat2 { 0%,100%{transform:translateY(-4px)} 50%{transform:translateY(-17px)} }

    /* Name tag */
    .char-name { font-family:"Fredoka One",cursive; font-size:1.1rem; margin-top:2px; }
    .name-a { color:#db2777; }
    .name-m { color:#7c3aed; }

    /* Login card */
    .login-wrap { max-width:390px; width:100%; margin-top:10px; }
    .card { background:rgba(255,255,255,0.92)!important; border:2px solid rgba(214,51,132,0.15)!important; backdrop-filter:blur(16px)!important; padding:22px 20px!important; }
    .login-tabs { display:flex; background:rgba(253,228,236,0.6); border-radius:999px; padding:4px; margin-bottom:18px; border:2px solid rgba(214,51,132,0.18); }
    .login-tab { flex:1; padding:9px; text-align:center; border-radius:999px; font-weight:800; font-size:0.88rem; cursor:pointer; color:#9d174d; transition:all 0.2s; border:none; background:transparent; font-family:"Nunito",sans-serif; }
    .login-tab.active { background:linear-gradient(135deg,#d63384,#f43f8e); color:#fff; box-shadow:0 4px 12px rgba(214,51,132,0.35); }
    .avatar-picker-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:10px 0 14px; }
    .avatar-option { aspect-ratio:1; border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; cursor:pointer; border:3px solid transparent; transition:all 0.18s; background:rgba(255,255,255,0.8); box-shadow:0 2px 8px rgba(0,0,0,0.07); }
    .avatar-option:hover,.avatar-option.selected { transform:scale(1.08); border-color:#d63384; box-shadow:0 0 0 3px rgba(214,51,132,0.2); }
    .av-emoji { font-size:1.6rem; }
    .av-label { font-size:0.55rem; font-weight:800; color:#9d174d; text-align:center; line-height:1.2; }
    .footer-note { text-align:center; font-size:0.76rem; color:#9d174d; margin-top:10px; font-weight:700; opacity:0.75; }

    @media(max-width:400px) {
      .duo-row { gap:4px; }
      .bubble { font-size:0.72rem; padding:8px 10px; }
      .char-col { max-width:170px; }
    }
  </style>
</head>

  </div><!-- /duo-row -->

  <!-- LOGIN CARD -->
  <div class="login-wrap">
    <div class="card">
      <div class="login-tabs">
        <button class="login-tab active" id="tab-login" onclick="showTab('login')">🔑 Log In</button>
        <button class="login-tab" id="tab-register" onclick="showTab('register')">🌟 Join Now</button>
      </div>

      <div id="form-login">
        <div class="form-group">
          <label class="form-label">Your Username</label>
          <input type="text" id="login-username" class="form-input" placeholder="e.g. priya2024" autocapitalize="none" autocomplete="username"/>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="Your secret password" autocomplete="current-password"/>
        </div>
        <p class="form-error" id="login-error"></p>
        <button class="btn btn-primary btn-full btn-lg" id="login-btn" onclick="doLogin()">🚀 Enter Our World!</button>
      </div>

      <div id="form-register" class="hidden">
        <div class="form-group">
          <label class="form-label">Your Name</label>
          <input type="text" id="reg-name" class="form-input" placeholder="e.g. Priya" autocomplete="given-name"/>
        </div>
        <div class="form-group">
          <label class="form-label">Choose a Username</label>
          <input type="text" id="reg-username" class="form-input" placeholder="e.g. priya2024" autocapitalize="none"/>
        </div>
        <div class="form-group">
          <label class="form-label">Your Grade</label>
          <select id="reg-grade" class="form-input">
            <option value="">Select your grade...</option>
            <option value="5">Grade 5</option>
            <option value="6">Grade 6</option>
            <option value="7">Grade 7</option>
            <option value="8">Grade 8</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Choose Your Avatar ✨</label>
          <div class="avatar-picker-grid" id="avatar-grid"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="reg-password" class="form-input" placeholder="At least 6 characters" autocomplete="new-password"/>
        </div>
        <p class="form-error" id="reg-error"></p>
        <button class="btn btn-primary btn-full btn-lg" id="reg-btn" onclick="doRegister()">🌟 Create My Account!</button>
      </div>
    </div>
    <p class="footer-note">💜 No email needed · Safe & private · Just for you!</p>
  </div>
</div>

<script type="module">
  import { login, register, getSession } from "./js/auth.js";
  import { AVATARS, initSparkles } from "./js/avatars.js";

  // Sparkles
  initSparkles(10);

  // Magical rain
  const rain = document.getElementById("rain");
  const rc = ["rgba(244,114,182,.6)","rgba(167,139,250,.5)","rgba(251,191,36,.4)","rgba(196,181,253,.55)","rgba(45,212,191,.4)"];
  for (let i = 0; i < 52; i++) {
    const d = document.createElement("div");
    d.className = "rdrop";
    const len = 10 + Math.random()*14;
    d.style.cssText = `left:${Math.random()*100}%;width:${1+Math.random()*1.4}px;height:${len}px;background:linear-gradient(transparent,${rc[Math.floor(Math.random()*rc.length)]});animation-duration:${1.2+Math.random()*2}s;animation-delay:${Math.random()*3}s;`;
    rain.appendChild(d);
  }
  // Sparkle drops
  for (let i = 0; i < 10; i++) {
    const s = document.createElement("div");
    s.className = "rdrop";
    s.textContent = ["✨","💜","⭐","🌸","💎"][Math.floor(Math.random()*5)];
    s.style.cssText = `left:${Math.random()*100}%;font-size:${0.55+Math.random()*0.45}rem;width:auto;height:auto;background:none;animation-duration:${2+Math.random()*2.5}s;animation-delay:${Math.random()*4}s;`;
    rain.appendChild(s);
  }

  // Myra's bubble pops in later
  setTimeout(() => document.getElementById("myra-bubble").classList.add("show"), 1500);

  // Avatar picker
  let selectedAvatar = "star_princess";
  const grid = document.getElementById("avatar-grid");
  AVATARS.forEach(av => {
    const div = document.createElement("div");
    div.className = "avatar-option" + (av.id === selectedAvatar ? " selected" : "");
    div.style.background = av.gradient;
    div.innerHTML = `<span class="av-emoji">${av.emoji}</span><span class="av-label">${av.label}</span>`;
    div.addEventListener("click", () => {
      document.querySelectorAll(".avatar-option").forEach(o => o.classList.remove("selected"));
      div.classList.add("selected");
      selectedAvatar = av.id;
    });
    grid.appendChild(div);
  });

  // Redirect if already logged in
  (async () => {
    const s = await getSession();
    if (s) window.location.href = "pages/dashboard.html";
  })();

  window.showTab = t => {
    document.getElementById("form-login").classList.toggle("hidden", t !== "login");
    document.getElementById("form-register").classList.toggle("hidden", t !== "register");
    document.getElementById("tab-login").classList.toggle("active", t === "login");
    document.getElementById("tab-register").classList.toggle("active", t === "register");
    document.getElementById("login-error").textContent = "";
    document.getElementById("reg-error").textContent = "";
  };

  window.doLogin = async () => {
    const u = document.getElementById("login-username").value.trim();
    const p = document.getElementById("login-password").value;
    const e = document.getElementById("login-error");
    const b = document.getElementById("login-btn");
    if (!u||!p){e.textContent="Please fill in both fields! 🌸";return;}
    b.disabled=true; b.textContent="Opening your world... ✨"; e.textContent="";
    try { await login({username:u,password:p}); window.location.href="pages/dashboard.html"; }
    catch { e.textContent="Wrong username or password. Try again! 💜"; b.disabled=false; b.innerHTML="🚀 Enter Our World!"; }
  };

  window.doRegister = async () => {
    const n=document.getElementById("reg-name").value.trim();
    const u=document.getElementById("reg-username").value.trim().toLowerCase();
    const g=Number(document.getElementById("reg-grade").value);
    const p=document.getElementById("reg-password").value;
    const e=document.getElementById("reg-error");
    const b=document.getElementById("reg-btn");
    if(!n){e.textContent="Please enter your name! 🌸";return;}
    if(!u||!/^[a-z0-9_]+$/.test(u)){e.textContent="Username: letters, numbers and _ only!";return;}
    if(!g){e.textContent="Please select your grade! 📚";return;}
    if(p.length<6){e.textContent="Password needs at least 6 characters! 🔒";return;}
    b.disabled=true; b.textContent="Creating your world... 🌟"; e.textContent="";
    try { await register({username:u,displayName:n,password:p,gradeId:g,avatarType:selectedAvatar}); window.location.href="pages/dashboard.html"; }
    catch(err){ e.textContent=err.message?.includes("already")?"Username taken! Try another 💜":"Something went wrong. Try again! 💜"; b.disabled=false; b.innerHTML="🌟 Create My Account!"; }
  };

  document.addEventListener("keydown", e => {
    if(e.key!=="Enter")return;
    if(!document.getElementById("form-login").classList.contains("hidden")) window.doLogin();
    else window.doRegister();
  });
</script>
</body>
</html>
