<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Kids Play ✨ — Your Magical Learning World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div class="page-center">
  <div class="login-wrap">
    <div class="login-logo">
      <span class="login-logo-icon">🎮</span>
      <div class="login-logo-name">Kids Play</div>
      <div class="login-logo-tag">✨ Your magical world of learning ✨</div>
    </div>

    <div class="card">
      <div class="login-tabs">
        <button class="login-tab active" id="tab-login" onclick="showTab('login')">🔑 Log In</button>
        <button class="login-tab" id="tab-register" onclick="showTab('register')">🌟 Join Now</button>
      </div>

      <!-- Login -->
      <div id="form-login">
        <div class="form-group">
          <label class="form-label">Your Username</label>
          <input type="text" id="login-username" class="form-input" placeholder="e.g. aarav2024" autocapitalize="none"/>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="Your secret password"/>
        </div>
        <p class="form-error" id="login-error"></p>
        <button class="btn btn-primary btn-full btn-lg" id="login-btn" onclick="doLogin()">
          🚀 Enter My World!
        </button>
      </div>

      <!-- Register -->
      <div id="form-register" class="hidden">
        <div class="form-group">
          <label class="form-label">Your Name</label>
          <input type="text" id="reg-name" class="form-input" placeholder="e.g. Priya"/>
        </div>
        <div class="form-group">
          <label class="form-label">Choose a Username</label>
          <input type="text" id="reg-username" class="form-input" placeholder="e.g. priya2024" autocapitalize="none"/>
        </div>
        <div class="form-group">
          <label class="form-label">Your Grade</label>
          <select id="reg-grade" class="form-input">
            <option value="">Select your grade...</option>
            <option value="5">Grade 5</option>
            <option value="6">Grade 6</option>
            <option value="7">Grade 7</option>
            <option value="8">Grade 8</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Choose Your Avatar ✨</label>
          <div class="avatar-picker-grid" id="avatar-grid"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="reg-password" class="form-input" placeholder="At least 6 characters"/>
        </div>
        <p class="form-error" id="reg-error"></p>
        <button class="btn btn-primary btn-full btn-lg" id="reg-btn" onclick="doRegister()">
          🌟 Create My Account!
        </button>
      </div>
    </div>

    <p style="text-align:center; font-size:0.8rem; color:var(--text-muted); margin-top:14px; font-weight:700;">
      💜 No real email needed &nbsp;·&nbsp; Safe & private &nbsp;·&nbsp; Just for you!
    </p>
  </div>
</div>

<script type="module">
  import { login, register, getSession } from "./js/auth.js";
  import { AVATARS, initSparkles } from "./js/avatars.js";

  initSparkles(18);

  let selectedAvatar = "star_princess";

  // Build avatar picker
  const grid = document.getElementById("avatar-grid");
  AVATARS.forEach(av => {
    const div = document.createElement("div");
    div.className = "avatar-option" + (av.id === selectedAvatar ? " selected" : "");
    div.dataset.id = av.id;
    div.style.background = av.gradient;
    div.innerHTML = `<span class="av-emoji">${av.emoji}</span><span class="av-label">${av.label}</span>`;
    div.addEventListener("click", () => {
      document.querySelectorAll(".avatar-option").forEach(o => o.classList.remove("selected"));
      div.classList.add("selected");
      selectedAvatar = av.id;
    });
    grid.appendChild(div);
  });

  // Redirect if already logged in
  (async () => {
    const session = await getSession();
    if (session) window.location.href = "pages/dashboard.html";
  })();

  window.showTab = function(tab) {
    document.getElementById("form-login").classList.toggle("hidden", tab !== "login");
    document.getElementById("form-register").classList.toggle("hidden", tab !== "register");
    document.getElementById("tab-login").classList.toggle("active", tab === "login");
    document.getElementById("tab-register").classList.toggle("active", tab === "register");
    document.getElementById("login-error").textContent = "";
    document.getElementById("reg-error").textContent = "";
  };

  window.doLogin = async function() {
    const username = document.getElementById("login-username").value.trim();
    const password = document.getElementById("login-password").value;
    const errEl    = document.getElementById("login-error");
    const btn      = document.getElementById("login-btn");
    if (!username || !password) { errEl.textContent = "Please fill in both fields! 🌸"; return; }
    btn.disabled = true; btn.textContent = "Opening your world... ✨";
    errEl.textContent = "";
    try {
      await login({ username, password });
      window.location.href = "pages/dashboard.html";
    } catch {
      errEl.textContent = "Hmm, wrong username or password. Try again! 💜";
      btn.disabled = false;
      btn.innerHTML = "🚀 Enter My World!";
    }
  };

  window.doRegister = async function() {
    const displayName = document.getElementById("reg-name").value.trim();
    const username    = document.getElementById("reg-username").value.trim().toLowerCase();
    const gradeId     = Number(document.getElementById("reg-grade").value);
    const password    = document.getElementById("reg-password").value;
    const errEl       = document.getElementById("reg-error");
    const btn         = document.getElementById("reg-btn");
    if (!displayName) { errEl.textContent = "Please enter your name! 🌸"; return; }
    if (!username || !/^[a-z0-9_]+$/.test(username)) { errEl.textContent = "Username: only letters, numbers and underscore!"; return; }
    if (!gradeId) { errEl.textContent = "Please select your grade! 📚"; return; }
    if (password.length < 6) { errEl.textContent = "Password must be at least 6 characters! 🔒"; return; }
    btn.disabled = true; btn.textContent = "Creating your world... 🌟";
    errEl.textContent = "";
    try {
      await register({ username, displayName, password, gradeId, avatarType: selectedAvatar });
      window.location.href = "pages/dashboard.html";
    } catch (err) {
      errEl.textContent = err.message?.includes("already") ? "That username is taken! Try a different one 💜" : "Something went wrong. Try again! 💜";
      btn.disabled = false;
      btn.innerHTML = "🌟 Create My Account!";
    }
  };

  document.addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    if (!document.getElementById("form-login").classList.contains("hidden")) window.doLogin();
    else window.doRegister();
  });
</script>
</body>
</html>
