<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Kids Play — Learn & Play!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div class="page-center">
  <div class="login-wrap">
    <div class="login-logo">
      <div class="login-logo-icon">🎮</div>
      <div class="login-logo-name">Kids Play</div>
      <div class="login-logo-tag">Learn through games · Grade 5–8</div>
    </div>

    <div class="card">
      <!-- Tabs -->
      <div class="login-tabs" role="tablist">
        <button class="login-tab active" id="tab-login" onclick="showTab('login')">🔑 Log In</button>
        <button class="login-tab" id="tab-register" onclick="showTab('register')">✨ Register</button>
      </div>

      <!-- Login form -->
      <div id="form-login">
        <div class="form-group">
          <label class="form-label" for="login-username">Username</label>
          <input type="text" id="login-username" class="form-input" placeholder="Your username" autocomplete="username" autocapitalize="none"/>
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="Your password" autocomplete="current-password"/>
        </div>
        <p class="form-error" id="login-error"></p>
        <button class="btn btn-primary btn-full btn-lg" id="login-btn" onclick="doLogin()">
          🚀 Let's Play!
        </button>
      </div>

      <!-- Register form -->
      <div id="form-register" class="hidden">
        <div class="form-group">
          <label class="form-label" for="reg-name">Your Name</label>
          <input type="text" id="reg-name" class="form-input" placeholder="e.g. Aarav" autocomplete="given-name"/>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-username">Choose a Username</label>
          <input type="text" id="reg-username" class="form-input" placeholder="e.g. aarav2024" autocomplete="username" autocapitalize="none"/>
          <p style="font-size:0.78rem; color:var(--text-muted); margin-top:4px;">Letters and numbers only. No spaces.</p>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-grade">Your Grade</label>
          <select id="reg-grade" class="form-input">
            <option value="">Select your grade...</option>
            <option value="5">Grade 5</option>
            <option value="6">Grade 6</option>
            <option value="7">Grade 7</option>
            <option value="8">Grade 8</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-password">Password</label>
          <input type="password" id="reg-password" class="form-input" placeholder="At least 6 characters" autocomplete="new-password"/>
        </div>
        <p class="form-error" id="reg-error"></p>
        <button class="btn btn-success btn-full btn-lg" id="reg-btn" onclick="doRegister()">
          🌟 Create Account
        </button>
      </div>
    </div>

    <p style="text-align:center; font-size:0.8rem; color:var(--text-muted); margin-top:16px;">
      No real email needed • Just username + password • Private & safe
    </p>
  </div>
</div>

<script type="module">
  import { login, register, getSession } from "./js/auth.js";

  // If already logged in, go straight to dashboard
  (async () => {
    const session = await getSession();
    if (session) window.location.href = "pages/dashboard.html";
  })();

  window.showTab = function(tab) {
    document.getElementById("form-login").classList.toggle("hidden", tab !== "login");
    document.getElementById("form-register").classList.toggle("hidden", tab !== "register");
    document.getElementById("tab-login").classList.toggle("active", tab === "login");
    document.getElementById("tab-register").classList.toggle("active", tab === "register");
    document.getElementById("login-error").textContent = "";
    document.getElementById("reg-error").textContent = "";
  };

  window.doLogin = async function() {
    const username = document.getElementById("login-username").value.trim();
    const password = document.getElementById("login-password").value;
    const errEl    = document.getElementById("login-error");
    const btn      = document.getElementById("login-btn");

    if (!username || !password) { errEl.textContent = "Please enter your username and password."; return; }

    btn.disabled = true;
    btn.textContent = "Logging in...";
    errEl.textContent = "";

    try {
      await login({ username, password });
      window.location.href = "pages/dashboard.html";
    } catch (err) {
      errEl.textContent = "Username or password is wrong. Try again!";
      btn.disabled = false;
      btn.innerHTML = "🚀 Let's Play!";
    }
  };

  window.doRegister = async function() {
    const displayName = document.getElementById("reg-name").value.trim();
    const username    = document.getElementById("reg-username").value.trim().toLowerCase();
    const gradeId     = Number(document.getElementById("reg-grade").value);
    const password    = document.getElementById("reg-password").value;
    const errEl       = document.getElementById("reg-error");
    const btn         = document.getElementById("reg-btn");

    if (!displayName) { errEl.textContent = "Please enter your name."; return; }
    if (!username || !/^[a-z0-9_]+$/.test(username)) { errEl.textContent = "Username: letters and numbers only, no spaces."; return; }
    if (!gradeId) { errEl.textContent = "Please select your grade."; return; }
    if (password.length < 6) { errEl.textContent = "Password must be at least 6 characters."; return; }

    btn.disabled = true;
    btn.textContent = "Creating account...";
    errEl.textContent = "";

    try {
      await register({ username, displayName, password, gradeId });
      window.location.href = "pages/dashboard.html";
    } catch (err) {
      if (err.message?.includes("already")) {
        errEl.textContent = "That username is already taken. Try a different one!";
      } else {
        errEl.textContent = "Something went wrong. Please try again.";
      }
      btn.disabled = false;
      btn.innerHTML = "🌟 Create Account";
    }
  };

  // Allow Enter key to submit
  document.addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    const loginHidden = document.getElementById("form-login").classList.contains("hidden");
    if (!loginHidden) window.doLogin();
    else window.doRegister();
  });
</script>
</body>
</html>
