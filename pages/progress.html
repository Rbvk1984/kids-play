<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Kids Play ✨ — My Progress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/style.css"/>
  <style>
    .stat-card { background:#fff; border-radius:var(--r-sm); padding:18px 14px; text-align:center; border:2px solid var(--border); box-shadow:var(--shadow-sm); }
    .stat-card .val { font-family:"Fredoka One",cursive; font-size:2rem; color:var(--primary); line-height:1; }
    .stat-card .lbl { font-size:0.72rem; font-weight:800; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em; margin-top:4px; }
    .subject-row { background:#fff; border-radius:var(--r-sm); padding:14px 16px; border:2px solid var(--border); margin-bottom:10px; box-shadow:var(--shadow-sm); }
    .subject-row-top { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
    .subject-emoji-sm { font-size:1.4rem; }
    .subject-name-sm { font-weight:900; font-size:0.95rem; color:var(--text); flex:1; }
    .accuracy-badge { font-size:0.82rem; font-weight:800; color:var(--primary); background:rgba(214,51,132,0.1); padding:3px 10px; border-radius:999px; }
    .prog-bar { height:10px; background:rgba(214,51,132,0.12); border-radius:999px; overflow:hidden; margin-bottom:6px; }
    .prog-fill { height:100%; border-radius:999px; background:linear-gradient(90deg,var(--primary),var(--secondary)); transition:width 0.8s cubic-bezier(0.34,1.2,0.64,1); }
    .topic-rows { margin-top:8px; display:flex; flex-direction:column; gap:6px; }
    .topic-row { display:flex; align-items:center; gap:8px; font-size:0.82rem; background:var(--bg-muted); border-radius:8px; padding:6px 10px; }
    .topic-row-name { flex:1; font-weight:700; color:var(--text); }
    .topic-row-acc { font-weight:800; font-size:0.8rem; }
    .session-row { background:#fff; border-radius:var(--r-sm); padding:12px 14px; border:2px solid var(--border); margin-bottom:8px; display:flex; align-items:center; gap:12px; box-shadow:var(--shadow-sm); }
    .session-emoji { font-size:1.5rem; flex-shrink:0; }
    .session-info { flex:1; }
    .session-topic { font-weight:900; font-size:0.9rem; color:var(--text); }
    .session-sub { font-size:0.78rem; color:var(--text-muted); font-weight:700; }
    .session-score { font-family:"Fredoka One",cursive; font-size:1.3rem; color:var(--primary); text-align:right; }
    .session-acc { font-size:0.75rem; color:var(--text-muted); font-weight:700; text-align:right; }
    .empty-prog { text-align:center; padding:30px 16px; color:var(--text-muted); }
  </style>
</head>
<body>

<header class="kp-header">
  <a href="dashboard.html" class="kp-logo" style="font-size:1.1rem;">🎮 Kids Play</a>
  <div class="kp-header-right">
    <div id="header-avatar-wrap"></div>
    <span class="kp-username" id="header-name"></span>
    <a href="dashboard.html" class="btn btn-ghost" style="padding:7px 14px;font-size:0.82rem;">← Back</a>
  </div>
</header>

<div class="page-wrap" style="max-width:700px;">

  <!-- Overall stats -->
  <div style="margin-bottom:24px; opacity:0; transition:opacity 0.4s;" id="main-content">

    <div style="display:flex; align-items:center; gap:14px; margin-bottom:22px; background:linear-gradient(135deg,var(--primary),var(--secondary)); border-radius:var(--r); padding:18px 22px; color:#fff;">
      <div id="profile-avatar" style="font-size:2.8rem; flex-shrink:0;"></div>
      <div>
        <div style="font-family:'Fredoka One',cursive; font-size:1.3rem;" id="profile-name">Loading...</div>
        <div style="font-size:0.85rem; opacity:0.85; font-weight:700;" id="profile-grade"></div>
      </div>
      <div style="margin-left:auto; text-align:right;">
        <div style="font-family:'Fredoka One',cursive; font-size:1.8rem;" id="total-score">0</div>
        <div style="font-size:0.75rem; opacity:0.85; font-weight:700;">Total Points ⭐</div>
      </div>
    </div>

    <!-- 4 stats -->
    <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:28px;" id="stats-grid">
      <div class="stat-card"><div class="val" id="s-sessions">—</div><div class="lbl">🎮 Games</div></div>
      <div class="stat-card"><div class="val" id="s-questions">—</div><div class="lbl">❓ Questions</div></div>
      <div class="stat-card"><div class="val" id="s-accuracy">—</div><div class="lbl">🎯 Accuracy</div></div>
      <div class="stat-card"><div class="val" id="s-streak">—</div><div class="lbl">🔥 Best Streak</div></div>
    </div>

    <!-- Subject progress -->
    <div class="section-title" style="margin-bottom:14px;">📚 Progress by Subject</div>
    <div id="subject-progress">
      <div class="empty-prog"><div style="font-size:2rem;">⏳</div><div style="font-weight:800; margin-top:8px;">Loading progress...</div></div>
    </div>

    <!-- Recent games -->
    <div class="section-title" style="margin:24px 0 14px;">🕐 Recent Games</div>
    <div id="recent-games">
      <div class="empty-prog"><div style="font-size:2rem;">⏳</div></div>
    </div>
  </div>

  <div id="loading-state" style="text-align:center; padding:60px 20px;">
    <div style="font-size:3rem;">⏳</div>
    <div style="font-weight:800; color:var(--text-muted); margin-top:12px;">Loading your progress...</div>
  </div>

</div>

<script type="module">
  import { requireAuth } from "../js/guard.js";
  import { supabase }    from "../js/supabase.js";
  import { getAvatar, renderAvatarBadge, initSparkles } from "../js/avatars.js";

  initSparkles(8);

  (async () => {
    const auth = await requireAuth();
    if (!auth) return;
    const { profile } = auth;

    const av = getAvatar(profile.avatar_type || "star_princess");
    document.getElementById("header-avatar-wrap").innerHTML = renderAvatarBadge(av.id, 40);
    document.getElementById("header-name").textContent = profile.display_name;
    document.getElementById("profile-avatar").textContent = av.emoji;
    document.getElementById("profile-name").textContent = profile.display_name + "'s Progress";
    document.getElementById("profile-grade").textContent = profile.kp_grades?.name || "";
    document.getElementById("total-score").textContent = (profile.total_score||0).toLocaleString();

    // Fetch all sessions
    const { data: sessions } = await supabase
      .from("kp_game_sessions")
      .select("*, kp_topics(name, kp_subjects(name, emoji, color))")
      .eq("player_id", profile.id)
      .eq("status", "completed")
      .order("completed_at", { ascending: false });

    // Fetch per-topic progress
    const { data: progress } = await supabase
      .from("kp_progress")
      .select("*, kp_subjects(name, emoji, color), kp_topics(name)")
      .eq("player_id", profile.id)
      .not("topic_id", "is", null);

    document.getElementById("loading-state").style.display = "none";
    document.getElementById("main-content").style.opacity = "1";

    if (!sessions?.length) {
      document.getElementById("subject-progress").innerHTML = `<div class="empty-prog">
        <div style="font-size:2.5rem">🌱</div>
        <div style="font-weight:800; margin-top:10px; color:var(--text-muted)">No games played yet!</div>
        <div style="font-size:0.85rem; color:var(--text-muted); margin-top:4px; font-weight:700">Play a game to start tracking your progress ✨</div>
        <a href="dashboard.html" class="btn btn-primary mt-4" style="display:inline-flex;">🎮 Play Now</a>
      </div>`;
      document.getElementById("recent-games").innerHTML = "";
      document.getElementById("s-sessions").textContent = "0";
      document.getElementById("s-questions").textContent = "0";
      document.getElementById("s-accuracy").textContent = "0%";
      document.getElementById("s-streak").textContent = "0";
      return;
    }

    // Overall stats
    const totalQ   = sessions.reduce((a,s) => a + s.total_questions, 0);
    const totalC   = sessions.reduce((a,s) => a + s.correct_count, 0);
    const maxStreak= Math.max(...sessions.map(s => s.best_streak));
    const acc      = totalQ > 0 ? Math.round((totalC/totalQ)*100) : 0;
    document.getElementById("s-sessions").textContent  = sessions.length;
    document.getElementById("s-questions").textContent = totalQ;
    document.getElementById("s-accuracy").textContent  = acc + "%";
    document.getElementById("s-streak").textContent    = maxStreak;

    // Subject breakdown
    const subjectMap = {};
    (progress || []).forEach(p => {
      const sname = p.kp_subjects?.name;
      if (!sname) return;
      if (!subjectMap[sname]) {
        subjectMap[sname] = {
          emoji: p.kp_subjects.emoji,
          color: p.kp_subjects.color,
          total: 0, correct: 0, topics: []
        };
      }
      subjectMap[sname].total   += p.total_questions;
      subjectMap[sname].correct += p.correct_count;
      subjectMap[sname].topics.push({
        name: p.kp_topics?.name || "Topic",
        acc:  p.total_questions > 0 ? Math.round((p.correct_count/p.total_questions)*100) : 0,
        sessions: p.sessions_count,
      });
    });

    const spEl = document.getElementById("subject-progress");
    if (!Object.keys(subjectMap).length) {
      spEl.innerHTML = `<div class="empty-prog"><div style="font-size:2rem">📊</div><div style="font-weight:800">No detailed progress yet</div></div>`;
    } else {
      spEl.innerHTML = "";
      Object.entries(subjectMap).forEach(([name, data]) => {
        const acc2 = data.total > 0 ? Math.round((data.correct/data.total)*100) : 0;
        const row = document.createElement("div");
        row.className = "subject-row";
        row.innerHTML = `
          <div class="subject-row-top">
            <span class="subject-emoji-sm">${data.emoji}</span>
            <span class="subject-name-sm">${name}</span>
            <span class="accuracy-badge">${acc2}% accuracy</span>
          </div>
          <div class="prog-bar"><div class="prog-fill" style="width:0%; background:linear-gradient(90deg,${data.color},${data.color}99);" data-target="${acc2}"></div></div>
          <div style="font-size:0.78rem; color:var(--text-muted); font-weight:700; margin-bottom:4px;">${data.correct} of ${data.total} questions correct</div>
          <div class="topic-rows">
            ${data.topics.map(t => `
              <div class="topic-row">
                <span class="topic-row-name">${t.name}</span>
                <span class="topic-row-acc" style="color:${t.acc>=80?'var(--correct)':t.acc>=50?'var(--streak)':'var(--wrong)'}">${t.acc}%</span>
                <span style="font-size:0.75rem; color:var(--text-muted); font-weight:700;">${t.sessions} game${t.sessions!==1?'s':''}</span>
              </div>`).join("")}
          </div>`;
        spEl.appendChild(row);
        // Animate progress bar
        setTimeout(() => {
          row.querySelector(".prog-fill").style.width = acc2 + "%";
        }, 100);
      });
    }

    // Recent sessions (last 8)
    const rgEl = document.getElementById("recent-games");
    rgEl.innerHTML = "";
    sessions.slice(0,8).forEach(s => {
      const acc3 = s.total_questions > 0 ? Math.round((s.correct_count/s.total_questions)*100) : 0;
      const date = new Date(s.completed_at).toLocaleDateString("en-IN", { day:"numeric", month:"short" });
      const subjName = s.kp_topics?.kp_subjects?.name || "";
      const subjEmoji = s.kp_topics?.kp_subjects?.emoji || "📚";
      const topicName = s.kp_topics?.name || "Game";
      const row = document.createElement("div");
      row.className = "session-row";
      row.innerHTML = `
        <div class="session-emoji">${subjEmoji}</div>
        <div class="session-info">
          <div class="session-topic">${topicName}</div>
          <div class="session-sub">${subjName} · ${date}</div>
        </div>
        <div>
          <div class="session-score">⭐ ${s.score}</div>
          <div class="session-acc" style="color:${acc3>=80?'var(--correct)':acc3>=50?'var(--streak)':'var(--wrong)'}">${acc3}% correct</div>
        </div>`;
      rgEl.appendChild(row);
    });
  })();
</script>
</body>
</html>
