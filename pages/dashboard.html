<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Kids Play ✨ — Choose a Subject</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>

<header class="kp-header">
  <a href="dashboard.html" class="kp-logo">🎮 Kids<span class="logo-dot">Play</span></a>
  <div class="kp-header-right">
    <div id="header-avatar-wrap"></div>
    <span class="kp-username" id="header-name">Loading...</span>
    <button class="btn btn-ghost" style="padding:8px 16px; font-size:0.85rem;" onclick="doLogout()">Sign Out 👋</button>
  </div>
</header>

<div class="page-wrap">

  <!-- Welcome banner -->
  <div class="welcome-banner" id="welcome-banner" style="opacity:0; transition:opacity 0.5s;">
    <div id="welcome-avatar" style="font-size:3rem; flex-shrink:0;"></div>
    <div>
      <div style="font-family:'Fredoka One',cursive; font-size:1.4rem;" id="welcome-text">Hi there! 👋</div>
      <div style="font-size:0.9rem; opacity:0.88; font-weight:700;" id="welcome-grade">Loading your profile...</div>
    </div>
    <div style="margin-left:auto; text-align:right; flex-shrink:0;">
      <div style="font-family:'Fredoka One',cursive; font-size:1.8rem;" id="total-score">0</div>
      <div style="font-size:0.75rem; opacity:0.85; font-weight:700;">Total Points ⭐</div>
    </div>
  </div>

  <!-- Subject section -->
  <div id="subject-section">
    <div class="section-title">📚 Choose a Subject</div>
    <div class="section-sub">Pick a subject and start earning stars! ⭐</div>
    <div class="subject-grid" id="subject-grid">
      <div class="empty-state" style="grid-column:1/-1">
        <div class="empty-state-emoji">⏳</div>
        <div class="empty-state-text">Loading magical subjects...</div>
      </div>
    </div>
  </div>

  <!-- Topic section -->
  <div id="topic-section" class="hidden">
    <div class="breadcrumb">
      <a href="dashboard.html" style="color:var(--text-muted); text-decoration:none; font-weight:800;">🏠 Home</a>
      <span class="sep">›</span>
      <span id="breadcrumb-subject"></span>
    </div>
    <div class="section-title" id="topic-heading"></div>
    <div class="section-sub">Choose a topic to play! 🎮</div>
    <div class="topic-list" id="topic-list">
      <div class="empty-state">
        <div class="empty-state-emoji">⏳</div>
        <div class="empty-state-text">Loading topics...</div>
      </div>
    </div>
    <button class="btn btn-ghost mt-4" onclick="showSubjects()">← Back to Subjects</button>
  </div>

</div>

<script type="module">
  import { requireAuth } from "../js/guard.js";
  import { logout as authLogout } from "../js/auth.js";
  import { supabase } from "../js/supabase.js";
  import { getAvatar, renderAvatarBadge, initSparkles } from "../js/avatars.js";

  initSparkles(14);

  let profile = null;

  (async () => {
    const auth = await requireAuth();
    if (!auth) return;
    profile = auth.profile;

    // Avatar
    const av = getAvatar(profile.avatar_type || "star_princess");
    document.getElementById("header-avatar-wrap").innerHTML =
      renderAvatarBadge(av.id, 44);
    document.getElementById("header-name").textContent = profile.display_name;
    document.getElementById("welcome-avatar").textContent = av.emoji;

    // Welcome
    const hour = new Date().getHours();
    const greet = hour < 12 ? "Good morning" : hour < 17 ? "Good afternoon" : "Good evening";
    document.getElementById("welcome-text").textContent = `${greet}, ${profile.display_name}! ${av.emoji}`;
    document.getElementById("welcome-grade").textContent =
      `${profile.kp_grades?.name || ""} · Ready to learn and earn stars? 🌟`;
    document.getElementById("total-score").textContent = (profile.total_score || 0).toLocaleString();
    setTimeout(() => { document.getElementById("welcome-banner").style.opacity = "1"; }, 100);

    await loadSubjects();
  })();

  async function loadSubjects() {
    const subjectColors = {
      "Mathematics": "#7c3aed", "Science": "#0891b2",
      "English": "#d63384", "Social Studies": "#f59e0b",
      "Hindi": "#be185d", "Computer Science": "#5b21b6",
    };

    const { data, error } = await supabase
      .from("kp_subjects").select("*").eq("active", true).order("sort_order");

    if (error || !data?.length) {
      document.getElementById("subject-grid").innerHTML = `
        <div class="empty-state" style="grid-column:1/-1">
          <div class="empty-state-emoji">📭</div>
          <div class="empty-state-text">No subjects found yet!</div>
          <p style="font-size:0.82rem; color:var(--text-muted); margin-top:8px; font-weight:700;">
            Please ask your admin to run the seed SQL files (03_seed.sql and 04_questions.sql) in Supabase.
          </p>
        </div>`;
      return;
    }

    const grid = document.getElementById("subject-grid");
    grid.innerHTML = "";
    data.forEach((subject, i) => {
      const color = subjectColors[subject.name] || "#d63384";
      const card = document.createElement("div");
      card.className = "subject-card";
      card.style.setProperty("--subject-color", color);
      card.style.animationDelay = `${i * 0.08}s`;
      card.innerHTML = `
        <div class="subject-emoji">${subject.emoji}</div>
        <div class="subject-name">${subject.name}</div>
      `;
      card.addEventListener("click", () => selectSubject({ ...subject, color }));
      grid.appendChild(card);
    });
  }

  async function selectSubject(subject) {
    document.getElementById("breadcrumb-subject").textContent = subject.name;
    document.getElementById("topic-heading").textContent = `${subject.emoji} ${subject.name}`;
    document.getElementById("subject-section").classList.add("hidden");
    document.getElementById("topic-section").classList.remove("hidden");

    const { data, error } = await supabase
      .from("kp_topics")
      .select("*")
      .eq("subject_id", subject.id)
      .eq("grade_id", profile.grade_id)
      .eq("active", true)
      .order("sort_order");

    const list = document.getElementById("topic-list");
    if (error || !data?.length) {
      list.innerHTML = `<div class="empty-state"><div class="empty-state-emoji">📭</div><div class="empty-state-text">No topics for your grade yet — more coming soon! 🌟</div></div>`;
      return;
    }

    list.innerHTML = "";
    data.forEach(topic => {
      const card = document.createElement("div");
      card.className = "topic-card";
      card.innerHTML = `
        <div class="topic-icon" style="background:${subject.color}22; color:${subject.color}">${subject.emoji}</div>
        <div class="topic-info">
          <div class="topic-name">${topic.name}</div>
          ${topic.description ? `<div class="topic-desc">${topic.description}</div>` : ""}
        </div>
        <div class="topic-arrow">›</div>
      `;
      card.addEventListener("click", () => {
        sessionStorage.setItem("kp_topic",   JSON.stringify(topic));
        sessionStorage.setItem("kp_subject", JSON.stringify(subject));
        window.location.href = "game.html";
      });
      list.appendChild(card);
    });
  }

  window.showSubjects = () => {
    document.getElementById("subject-section").classList.remove("hidden");
    document.getElementById("topic-section").classList.add("hidden");
  };

  window.doLogout = async () => {
    await authLogout();
  };
</script>
</body>
</html>
